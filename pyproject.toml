[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsbench"
version = "1.0.0"
description = "Trustworthy on-device benchmarking and optimisation for NeuTTS-Nano"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "soundfile>=0.12",
    "librosa>=0.10",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
# the model stack (torchao pin: torchtune 0.6.1 imports a module removed in torchao 0.16+)
neutts = ["neutts[all]==1.4.1", "torchao==0.15.0"]
quality = ["faster-whisper>=1.1", "jiwer>=3.0", "num2words>=0.5.13", "speechbrain>=1.0", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["ttsbench[neutts,quality,dev]"]

[project.scripts]
ttsbench = "ttsbench.cli:main"

[tool.setuptools.packages.find]
include = ["ttsbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scripts/microbench"]  # one-off diagnostics, kept as run (reports/microbench)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW1510"]
ignore = ["E501", "B905"]  # zip lengths are equal by construction in every call site
