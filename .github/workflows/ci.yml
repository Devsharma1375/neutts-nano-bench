# Tests the framework itself on every push. No NeuTTS weights needed: the upstream
# equivalence tests install neutts (public on PyPI); the end-to-end test uses the mock engine.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -c constraints.txt torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c constraints.txt "neutts==1.4.1" "torchao==0.15.0" gguf -e ".[dev]" num2words matplotlib jiwer
      - run: ruff check ttsbench tests
      - run: python -m pytest